# Màu giao diện Streamlit (Yến). Tông kem + nâu caramel cho tiệm bánh.
[theme]
base = "light"
primaryColor = "#B45309"              # nâu caramel: nút chính, tab đang chọn, ô tick
backgroundColor = "#FFFBF5"           # nền kem nhạt
secondaryBackgroundColor = "#F5EBDD"  # thanh bên, ô nhập, khung
textColor = "#3B2A1E"                 # chữ nâu đậm, dịu mắt hơn đen
font = "sans serif"
